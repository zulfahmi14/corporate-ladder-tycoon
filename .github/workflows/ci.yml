name: CI

# Runs on every push (so PR checks come from the branch run) and on demand.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BASE_URL: https://github.com/godotengine/godot/releases/download/4.7.2-stable
  # From the official SHA512-SUMS.txt of the 4.7.2-stable release.
  GODOT_LINUX_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  GODOT_TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dev tools (hash-locked)
        run: pip install --require-hashes -r requirements-dev.txt
      - name: GDScript format and lint
        run: |
          gdformat --check src tests
          gdlint src tests
      - name: Balance sim runs
        run: python3 tools/sim/sim.py
      - name: Parity fixture is up to date with tools/sim/economy.py
        run: |
          python3 tools/sim/export_parity.py
          git diff --exit-code tests/fixtures/economy_parity.json

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (pinned binary, checksum verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  test-and-build:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_TEMPLATES_SHA512 }}

      - name: Download Godot (checksum verified)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl && cd ~/godot-dl
          curl -sSfL -o godot.zip "$GODOT_BASE_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSfL -o templates.tpz "$GODOT_BASE_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      - name: Verify checksums and install
        run: |
          cd ~/godot-dl
          echo "${GODOT_LINUX_SHA512}  godot.zip" | sha512sum -c -
          echo "${GODOT_TEMPLATES_SHA512}  templates.tpz" | sha512sum -c -
          unzip -q -o godot.zip -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          tpl=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tpl"
          unzip -q -o templates.tpz -d "$RUNNER_TEMP/tpl"
          mv "$RUNNER_TEMP"/tpl/templates/* "$tpl/"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --path . --import

      - name: Unit tests
        run: godot --headless --path . -s tests/run_tests.gd

      - name: Game boots without errors
        run: |
          godot --headless --path . --quit-after 120 2>&1 | tee boot.log
          if grep -E "SCRIPT ERROR|Parse Error|^ERROR" boot.log; then exit 1; fi

      - name: Configure Android export (SDK, Java, throwaway debug key)
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          for v in 4 4.7; do
            mkdir -p ~/.config/godot
            cat > ~/.config/godot/editor_settings-$v.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          EOT
          done
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android Debug APK" \
            build/corporate-ladder-tycoon-debug.apk 2>&1 | tee export.log
          test -s build/corporate-ladder-tycoon-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corporate-ladder-tycoon-debug-apk
          path: build/corporate-ladder-tycoon-debug.apk
          retention-days: 7
          if-no-files-found: error
