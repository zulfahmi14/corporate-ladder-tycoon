name: CI

# Runs on every push (so PR checks come from the branch run) and on demand.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail, so `godot ... | tee` cannot hide a failure

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dev tools (hash-locked)
        run: pip install --require-hashes -r requirements-dev.txt
      - name: GDScript format and lint
        run: |
          gdformat --check src tests
          gdlint src tests
      - name: Translations CSV has exactly 2 columns per row
        run: |
          python3 - <<'PY'
          import csv, sys
          bad = [r for r in csv.reader(open("locale/translations.csv", encoding="utf-8")) if len(r) != 2]
          if bad:
              sys.exit(f"Malformed rows (quote values that contain commas): {bad}")
          PY
      - name: Every asset has a license row (assets/LICENSES.csv)
        run: python3 tools/check_assets.py
      - name: Balance sim runs
        run: python3 tools/sim/sim.py
      - name: Parity fixture is up to date with tools/sim/economy.py
        run: |
          python3 tools/sim/export_parity.py
          git diff --exit-code tests/fixtures/economy_parity.json

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (pinned binary, checksum verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  test-and-build:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-godot

      - name: Unit tests
        run: godot --headless --path . -s tests/run_tests.gd

      - name: Game boots without errors
        run: |
          godot --headless --path . --quit-after 120 2>&1 | tee boot.log
          if grep -E "SCRIPT ERROR|Parse Error|^ERROR" boot.log; then exit 1; fi

      - name: Throwaway debug key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android Debug APK" \
            build/corporate-ladder-tycoon-debug.apk 2>&1 | tee export.log
          test -s build/corporate-ladder-tycoon-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corporate-ladder-tycoon-debug-apk
          path: build/corporate-ladder-tycoon-debug.apk
          retention-days: 7
          if-no-files-found: error

  # Owner's phone download (D-13): every green build on main or a claude/ branch
  # replaces the APK behind one fixed public link:
  # https://github.com/<owner>/<repo>/releases/download/test-build/corporate-ladder-tycoon.apk
  publish-test-build:
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # only this job: create/update the test-build pre-release
    concurrency:
      group: publish-test-build
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corporate-ladder-tycoon-debug-apk
          path: dl

      - name: Replace the APK on the test-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          cp dl/corporate-ladder-tycoon-debug.apk corporate-ladder-tycoon.apk
          notes="Debug test build (not for the Play Store). Branch ${BRANCH}, commit ${SHA:0:7}, built $(date -u '+%Y-%m-%d %H:%M UTC'). Uninstall the previous test build before installing."
          if ! gh release view test-build --repo "$REPO" > /dev/null 2>&1; then
            gh release create test-build --repo "$REPO" --target "$SHA" --prerelease \
              --title "Latest test build" --notes "$notes"
          else
            gh release edit test-build --repo "$REPO" --notes "$notes"
          fi
          gh release upload test-build corporate-ladder-tycoon.apk --repo "$REPO" --clobber
